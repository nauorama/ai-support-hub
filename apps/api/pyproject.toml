[project]
name = "support-hub-api"
version = "0.0.0"
description = "Support Hub API, workflow and guardrails"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "starlette==1.10.0",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

# The import package stays `hub`; only the distribution name differs
# (`hub` is taken on PyPI).
[tool.uv.build-backend]
module-name = "hub"
