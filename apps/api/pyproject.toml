[project]
name = "support-hub-api"
version = "0.0.0"
description = "Support Hub API, workflow and guardrails"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    # Native code of argon2-cffi. Held at 26.1.0 (2026-08-20): 26.2.0 was published hours before
    # P2-05 and had no track record yet (design §9; P2-05 review).
    "argon2-cffi-bindings==26.1.0",
    "fastapi==0.162.0",
    "httpx2==2.16.0",
    # Signs the demo customer cookie (P2-06). 2.2.0 was published 2024-04-16.
    "itsdangerous==2.2.0",
    # Model gateway, used only in hub.llm.gateway (ADR-0003). 1.108.6 (LTS, 2026-11-12) is the
    # first 1.108 release with the fix for GHSA-2rwg-2wh4-7c4f; 1.108.3 is affected.
    "litellm==1.108.6",
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    # Knowledge-base front matter (P2-08) and config/models.yaml, config/pricing.yaml (P3-01),
    # read with `yaml.safe_load` only. 6.0.3: 2025-09-25.
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.8",
    "starlette==1.10.0",
    "structlog==26.1.0",
    "uuid-utils==1.2.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

# The import package stays `hub`; only the distribution name differs
# (`hub` is taken on PyPI).
[tool.uv.build-backend]
module-name = "hub"
