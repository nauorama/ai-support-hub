# Auto-merge of Dependabot pull requests (owner decision, after P8-06). Patch and minor
# updates get `gh pr merge --auto --squash`: GitHub merges them only after the required checks of
# the main ruleset (lint, test, test-int, data-check, security) are green. Never auto-merged:
# major updates, and the frozen packages that change model or retrieval behaviour (also ignored
# in .github/dependabot.yml, so this list is a second guard). The pattern follows GitHub's
# "Automating Dependabot with GitHub Actions" example; dependabot/fetch-metadata v3.1.0
# (2026-04-20), pinned by commit SHA like every action here.
name: dependabot-automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates outside the frozen list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) echo "not auto-merged: update type '$UPDATE_TYPE'"; exit 0 ;;
          esac
          IFS=',' read -ra names <<< "$DEPENDENCIES"
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            case "$name" in
              litellm|langchain*|langgraph*|fastembed|onnxruntime|qdrant-client)
                echo "not auto-merged: frozen package '$name'"; exit 0 ;;
            esac
          done
          gh pr merge --auto --squash "$PR_URL"
