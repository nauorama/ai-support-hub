# CI from docs/operations.md §5. Jobs added later: web (P10), e2e (P10), integration tests (P2),
# pnpm audit and Dependabot (P8-06). Every check runs a make target where one exists, so CI and
# a laptop run the same commands. Actions are pinned by commit SHA; the comment names the release.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.8"
  # Tests never need a provider key (AGENTS.md): the fake model mode answers instead.
  # Set empty for every job, so no step can pick a key up from the runner.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - name: ruff, mypy, import-linter (eslint, tsc once apps/web exists)
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - name: No provider API keys in the test job
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            echo "::error::a provider API key is set in the test job"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY and OPENAI_API_KEY are empty"
      - name: make version (test_repo_tooling.py reads make's database)
        run: make --version | head -1
      - name: Unit tests
        run: make test

  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked
      - run: make data-check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1" # keep equal to the gitleaks rev in .pre-commit-config.yaml
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --locked

      # The pre-commit hook runs `gitleaks git --staged`, which scans nothing in CI, so the
      # real scan uses the release binary, checked against its published SHA-256.
      - name: gitleaks (whole git history)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: pip-audit (locked dependencies, with hashes)
        run: |
          uv export --locked --all-packages --all-groups --no-emit-workspace \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off

      # Shows that the gitleaks pre-commit hook (language: golang) installs on a machine with
      # no Go and no pre-commit cache, as on a fresh laptop: pre-commit must download Go itself.
      - name: gitleaks pre-commit hook bootstraps without Go or a cache
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pre-commit-empty
        run: |
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | while read -r dir; do
            [ -x "$dir/go" ] || printf '%s\n' "$dir"; done | paste -sd: -)"
          export PATH
          if command -v go; then echo "::error::go is still on PATH"; exit 1; fi
          echo "go: not on PATH"
          if [ -e "$PRE_COMMIT_HOME" ]; then echo "::error::pre-commit cache exists"; exit 1; fi
          echo "pre-commit cache: none ($PRE_COMMIT_HOME)"
          uv run pre-commit run gitleaks --all-files --verbose
